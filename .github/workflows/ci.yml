name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SMT-FRONTEND/smarttoken-dev/smarttoken-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Unit tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Production build
        env:
          REACT_APP_NETWORK_ID: '56'
          REACT_APP_NODE_1: 'https://bsc-dataseed.binance.org'
          REACT_APP_NODE_2: 'https://bsc-dataseed1.defibit.io'
          REACT_APP_NODE_3: 'https://bsc-dataseed1.ninicoin.io'
        run: npm run build
